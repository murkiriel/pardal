name: Gerar dados

# Gera brasil/, estados/ e catalogo.json do zero (fontes oficiais + OpenStreetMap) e publica.
#
# Todo dia, às 03:17 e às 09:17 em Brasília. O job "interval" só segue para o build se ainda não
# houve uma execução bem-sucedida deste workflow hoje (UTC): o segundo disparo cobre o primeiro.
#   - Todo dia: a release (dados-AAAA-MM-DD), só se algum arquivo mudou em relação à última release
#     (sha256; release.py --skip-if-same).
#   - Uma vez por semana: também o commit em brasil/, estados/ e catalogo.json, na primeira geração
#     que passar a partir do domingo (se o domingo falhar, segunda tenta de novo; scripts/routine.py).
#   - Releases com mais de 90 dias são apagadas, menos as semanais (as do commit) e a mais nova.
#   - Falha de uma geração agendada abre a issue "Geração falhando"; a primeira que passar a fecha.
# O link releases/latest/download/pardal-<UF>.zip traz sempre o dado mais novo (até 1 dia); o
# repositório, o da semana.
#
# Cada fonte atualiza quando dá: a que falha usa a última leitura boa guardada em data/raw/fontes/
# (datakit/source_cache.py) ou, sem ela, o que a fonte tinha na edição publicada (o checkout do
# repositório; datakit/edition.py). Vira aviso e não barra a publicação; as outras seguem
# normalmente. As cópias ficam no cache do Actions, salvo mesmo quando o job falha (o GitHub apaga
# um cache que fica 7 dias sem uso; com o build diário, não chega a isso).
# Os horários ficam fora da hora cheia de propósito: é quando o GitHub mais atrasa ou pula os
# disparos agendados (o das 06:00 UTC de 01/10/2026 não aconteceu). São dois por dia porque um
# disparo pulado não avisa ninguém: o segundo cobre o primeiro e, se o primeiro já publicou, só
# confere a data e para.
#
# Arquivo publicado acima de 95 MB (o GitHub recusa a partir de 100 MB) sai compactado (.gz) e o
# catálogo aponta para o .gz (datakit/build_brazil.compress_oversized). Só se nem compactado couber
# o build registra falha.
# Também pode ser disparado à mão (Actions → Gerar dados → Run workflow), a qualquer momento; à
# mão, só publica se "publish" for marcado; sem isso, gera e confere (o log e a auditoria ficam
# nos artefatos).
#
# O DNIT, o Inmetro, a API de malhas do IBGE, a AGETO-TO e o DER-SE não aceitam conexão de fora do
# Brasil, e o portal de dados da ANTT às vezes devolve uma página de bloqueio em vez dos dados; as
# máquinas do Actions ficam nos EUA. O tráfego para esses servidores (e só para eles; lista em
# TUNNEL_HOSTS) sai por um túnel WireGuard com saída no Brasil,
# configurado no segredo MULLVAD_WG_CONF (arquivo .conf da VPN, nunca impresso). Se o túnel não
# subir, o job avisa e segue sem ele: essas fontes caem nas cópias guardadas (ou na edição).
#
# Cada publicação vira também uma release (dados-AAAA-MM-DD) com um zip por estado, o Brasil
# inteiro, só os radares do Brasil, o catálogo e os sha256 (scripts/release.py).
#
# O publish.py não monta nada se alguma fonte falhou sem cópia nem edição publicada, se algum estado
# perdeu mais de 5% dos dados em relação ao publicado ou se algum arquivo passa de 95 MB mesmo
# compactado: nesses
# casos o job falha e o GitHub avisa por e-mail; nada é publicado. À mão, "accept_failures" e
# "accept_drop" publicam assim mesmo (ex.: uma fonte que nunca foi lida e está fora do ar).
# Dia sem dado novo (só a data do catálogo mudou) não vira commit nem release.
#
# Reprodutível é só a geração corrente (D-12): as actions ficam fixadas pelo SHA do commit (a tag vai
# no comentário) e as dependências do Python, inclusive as transitivas, em versão exata e com hash
# (gerador/requirements.in → requirements.txt, instalado com --require-hashes). As fontes são lidas
# ao vivo e não ficam arquivadas, e as cópias do cache do Actions somem em 7 dias sem uso: uma
# geração antiga não se refaz.

on:
  schedule:
    - cron: "17 6 * * *"    # todo dia, 03:17 em Brasília (domingo: também o commit)
    - cron: "17 12 * * *"   # e 09:17 em Brasília, caso o primeiro seja pulado ou falhe
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar os dados (commit no repositório e release). Sem marcar: só gera e confere."
        type: boolean
        default: false
      accept_failures:
        description: "Publicar mesmo se alguma fonte falhou sem cópia guardada (fica sem ela)."
        type: boolean
        default: false
      accept_drop:
        description: "Publicar mesmo se algum estado perdeu mais de 5% dos dados."
        type: boolean
        default: false

permissions:
  contents: write
  actions: read      # o job "interval" lista as execuções de hoje

concurrency:
  group: gerar-dados
  cancel-in-progress: false

jobs:
  interval:
    # O agendamento só vale no repositório do projeto: um fork com o Actions ligado não gera nem publica
    # sozinho (não tem o segredo do túnel). À mão, gera onde for disparado. (A comparação de nomes nas
    # expressões do GitHub ignora maiúsculas: o repositório hoje é murkiriel/pardal.)
    if: github.event_name != 'schedule' || github.repository == 'murkiriel/pardal'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.today.outputs.run }}
    steps:
      - name: Já gerou hoje?
        id: today
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "disparado à mão: gera"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          today=$(date -u +%F)
          # execuções deste workflow que terminaram bem hoje (fora esta); sem resposta da API, gera
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow gerar-dados.yml --status success \
                --created ">=$today" --limit 20 --json databaseId \
                --jq "[.[] | select(.databaseId != $RUN_ID)] | length" 2>/dev/null || echo 0)
          if [ "${n:-0}" -gt 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "já houve uma geração bem-sucedida hoje ($today)"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "ainda não gerou hoje ($today): gera"
          fi

  generate:
    needs: interval
    if: needs.interval.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish == true }}
      EVENT: ${{ github.event_name }}
      ACCEPT_FAILURES: ${{ inputs.accept_failures == true }}
      ACCEPT_DROP: ${{ inputs.accept_drop == true }}
      # servidores que não aceitam conexão de fora do Brasil (medido no Actions em 2026-11-08: IBGE, AGETO-TO
      # e DER-SE davam ConnectTimeout); am.i.mullvad.net só confere a saída do túnel
      TUNNEL_HOSTS: >-
        servicos.dnit.gov.br servicos.rbmlq.gov.br dados.antt.gov.br servicodados.ibge.gov.br
        www.to.gov.br der.se.gov.br am.i.mullvad.net
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Código e dados publicados
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: murkiriel/pardal
          path: pardal

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      # todas as dependências (inclusive as transitivas) fixadas e com hash: gerador/requirements.in
      - name: Dependências
        run: pip install -q --require-hashes -r pardal/gerador/requirements.txt

      - name: Testes do gerador
        working-directory: pardal/gerador
        run: python -m unittest discover -s datakit/tests -t .

      # restore e save separados: o actions/cache sozinho só salva se o job inteiro passar, e as
      # cópias boas de hoje valem mesmo num dia em que a publicação foi barrada
      - name: Cópias anteriores das fontes (data/raw, sem os extratos do OSM)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            pardal/gerador/data/raw
            !pardal/gerador/data/raw/*.osm.pbf
            !pardal/gerador/data/raw/*.part
          key: pardal-raw-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pardal-raw-

      - name: Memória extra (swap)
        run: |
          sudo fallocate -l 8G /mnt/swap-pardal && sudo chmod 600 /mnt/swap-pardal
          sudo mkswap /mnt/swap-pardal >/dev/null && sudo swapon /mnt/swap-pardal
          free -h

      - name: Túnel para os servidores que só aceitam o Brasil (DNIT, Inmetro, ANTT, IBGE, AGETO-TO, DER-SE)
        env:
          WG_CONF: ${{ secrets.MULLVAD_WG_CONF }}
        run: |
          # Sem túnel o build segue: as fontes de TUNNEL_HOSTS falham daqui e caem nas cópias guardadas ou na
          # edição publicada (aviso).
          down() { echo "::warning::$1; seguindo sem o túnel (as fontes de TUNNEL_HOSTS usam as cópias guardadas)"
                   sudo wg-quick down wg0 >/dev/null 2>&1 || true; exit 0; }
          if [ -z "$WG_CONF" ]; then down "segredo MULLVAD_WG_CONF não configurado"; fi
          # o índice do apt da imagem pode estar velho (o .deb some do espelho: "Failed to fetch ... 404"); sem
          # o || down, o bash -e derrubava o job inteiro aqui (2026-11-11) em vez de seguir sem o túnel
          for i in 1 2 3; do
            sudo apt-get update -qq >/dev/null 2>&1 && sudo apt-get install -y -qq wireguard-tools >/dev/null && break
            sleep $((i * 10))
          done
          command -v wg-quick >/dev/null || down "não deu para instalar o wireguard-tools (apt)"
          IPS=$(for h in $TUNNEL_HOSTS; do getent ahostsv4 "$h" | awk '{print $1}'; done | sort -u | sed 's#$#/32#' | paste -sd, -)
          echo "pelo túnel: $IPS"
          printf '%s\n' "$WG_CONF" \
            | sed -E '/^[[:space:]]*DNS[[:space:]]*=/d; s#^[[:space:]]*AllowedIPs[[:space:]]*=.*#AllowedIPs = '"$IPS"'#' \
            | sudo tee /etc/wireguard/wg0.conf >/dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0 >/dev/null 2>&1 || down "o túnel não subiu (wg-quick)"
          exit_info=$(curl -s --max-time 20 https://am.i.mullvad.net/json) \
            || down "o túnel não respondeu (sem handshake com o servidor da Mullvad: chave revogada ou servidor desativado? gere outra configuração)"
          echo "$exit_info" | python -c 'import json,sys; j=json.load(sys.stdin); print("saída:", j.get("country"), "/", j.get("city"), "| mullvad:", j.get("mullvad_exit_ip"))' || true
          echo "$exit_info" | python -c 'import json,sys; j=json.load(sys.stdin); sys.exit(0 if j.get("mullvad_exit_ip") and j.get("country") == "Brazil" else 1)' \
            || down "o túnel não saiu pelo Brasil"

      - name: Build (27 estados + Brasil)
        working-directory: pardal/gerador
        run: |
          set -o pipefail
          mkdir -p data
          python run.py datakit.build --all 2>&1 | tee data/build.log

      - name: Guarda as cópias das fontes (mesmo se o build ou a publicação falharem)
        if: always() && hashFiles('pardal/gerador/data/raw/**') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            pardal/gerador/data/raw
            !pardal/gerador/data/raw/*.osm.pbf
            !pardal/gerador/data/raw/*.part
          key: pardal-raw-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Confere e monta (publica e cria a release se for o caso)
        working-directory: pardal/gerador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a geração anterior: a da última release (sai todo dia com dado novo); sem release, a do repositório
          prev="$RUNNER_TEMP/catalogo_anterior.json"
          curl -sfL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/catalogo.json" -o "$prev" \
            || cp ../catalogo.json "$prev" 2>/dev/null || cp ../catalog.json "$prev"
          flags=""
          [ "$ACCEPT_FAILURES" = "true" ] && flags="$flags --accept-failures"
          [ "$ACCEPT_DROP" = "true" ] && flags="$flags --accept-drop"
          repo_lc=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          # commit (repositório e release), release (só a release) ou none (só confere): scripts/routine.py
          # decide pelo catalogo.json do repositório. O commit sai na primeira geração agendada que passar
          # a partir do domingo; se o domingo falhar, segunda tenta de novo, e assim por diante.
          mode=$(python scripts/routine.py mode --catalog ../catalogo.json --event "$EVENT" --publish "$PUBLISH")
          [ "$repo_lc" != "murkiriel/pardal" ] && mode=none
          echo "modo: $mode"
          case "$mode" in
            none)
              python scripts/publish.py $flags
              python scripts/release.py --previous "$prev" --warnings data/dist/catalogo.json
              echo "Conferido e montado; sem publicar (publish=$PUBLISH, repositório=$GITHUB_REPOSITORY)." ;;
            release)
              # monta na cópia de trabalho (sem commit) e cria só a release, se houver dado novo
              python scripts/publish.py $flags
              python scripts/release.py --previous "$prev" --warnings data/dist/catalogo.json \
                --release-only --skip-if-same --create ;;
            commit)
              git -C .. config user.name "Murkiriel"
              git -C .. config user.email "14956419+Murkiriel@users.noreply.github.com"
              head_before=$(git -C .. rev-parse HEAD)
              python scripts/publish.py --commit --push $flags
              if [ "$(git -C .. rev-parse HEAD)" != "$head_before" ]; then
                python scripts/release.py --previous "$prev" --warnings data/dist/catalogo.json \
                  --skip-if-same --create
              else
                echo "Nada mudou nos dados do repositório: sem commit e sem release."
              fi ;;
          esac
          # releases com mais de 90 dias saem, menos as semanais (que foram para o repositório) e a mais nova
          if [ "$mode" != "none" ]; then
            python scripts/routine.py prune --repo "$GITHUB_REPOSITORY" \
              || echo "::warning::a limpeza das releases antigas falhou (não bloqueia)"
          fi

      - name: Desliga o túnel
        if: always()
        run: sudo wg-quick down wg0 >/dev/null 2>&1 || true

      - name: Log, auditoria e catálogo (artefatos)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: build-${{ github.run_number }}
          path: |
            pardal/gerador/data/build.log
            pardal/gerador/data/audit/
            pardal/gerador/data/dist/catalogo.json
            pardal/gerador/data/release/NOTAS.md
          if-no-files-found: ignore
          retention-days: 30

  notify:
    # Aviso de falha: geração agendada que falhou abre a issue "Geração falhando" (ou comenta nela); a
    # primeira que passar comenta e fecha (scripts/routine.py notify). Disparo à mão não mexe na issue.
    needs: [interval, generate]
    if: always() && github.event_name == 'schedule' && github.repository == 'murkiriel/pardal'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Código (só o script da rotina)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: gerador/scripts/routine.py
          sparse-checkout-cone-mode: false
      - name: Abre, comenta ou fecha a issue
        env:
          GH_TOKEN: ${{ github.token }}
          INTERVAL: ${{ needs.interval.result }}
          GENERATE: ${{ needs.generate.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "interval=$INTERVAL generate=$GENERATE"
          if [ "$INTERVAL" = "failure" ] || [ "$GENERATE" = "failure" ]; then
            python3 gerador/scripts/routine.py notify --repo "$GITHUB_REPOSITORY" --failed --run-url "$RUN_URL"
          elif [ "$GENERATE" = "success" ]; then
            python3 gerador/scripts/routine.py notify --repo "$GITHUB_REPOSITORY" --run-url "$RUN_URL"
          else
            echo "nada a fazer (não gerou: já havia geração hoje, ou foi cancelada)"
          fi
